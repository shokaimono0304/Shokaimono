<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shokaimono - Links & Reviews</title>
    <style>
        /* Tông màu Neo-Brutalism Pastel (Dựa theo image_33be02.png) */
        :root {
            --bg-main: #f0f8f9;       /* Nền xanh nhạt giống ảnh */
            --border-color: #2d3436;  /* Viền đen xám đậm */
            --shadow-color: #2d3436;  /* Bóng đổ cứng */
            
            --btn-pink: #ffe5ec;      /* Hồng nhạt */
            --btn-blue: #e5f0ff;      /* Xanh dương nhạt */
            --btn-yellow: #fff3cd;    /* Vàng nhạt */
            
            --text-main: #2d3436;
            --text-title: #d63031;    /* Chữ tiêu đề màu đỏ/hồng đậm */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: "Nunito", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* Font tròn trịa */
            background: var(--bg-main);
            color: var(--text-main); 
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- BACKGROUND BONG BÓNG MỜ (Giống ảnh) --- */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0;
        }
        .bubble {
            position: absolute;
            background: #d0e8e9; /* Màu chấm bi mờ */
            border-radius: 50%;
            opacity: 0.6;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* --- HEADER & MENU --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 20px;
            background: transparent;
            position: relative;
            z-index: 100;
        }

        .menu-btn {
            font-size: 28px;
            cursor: pointer;
            color: var(--border-color);
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 12px;
            width: 45px; height: 45px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 3px 3px 0px var(--shadow-color);
            transition: 0.1s;
        }
        .menu-btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px var(--shadow-color); }

        /* Đồng hồ khối hộp */
        .datetime-box { 
            display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
        }
        .time-block, .date-block {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 12px;
            padding: 4px 12px;
            box-shadow: 3px 3px 0px var(--shadow-color);
            text-align: center;
        }
        .time-block { color: var(--text-title); font-weight: 900; font-size: 16px; background: var(--btn-pink); }
        .date-block { font-size: 12px; font-weight: 800; color: #0984e3; background: var(--btn-blue); line-height: 1.4; }
        .date-lunar { font-size: 11px; color: var(--border-color); }

        /* --- SIDEBAR MENU (Khối cứng) --- */
        .sidebar {
            height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; left: 0;
            background: var(--bg-main);
            border-right: 4px solid var(--border-color);
            overflow-x: hidden; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding-top: 80px;
        }
        .sidebar a {
            padding: 16px 25px; text-decoration: none; font-size: 16px;
            color: var(--text-main); display: block; font-weight: 800;
            border-bottom: 3px solid var(--border-color); transition: 0.1s;
            margin: 0 15px 15px 15px; border: 3px solid var(--border-color);
            border-radius: 12px; background: #fff; box-shadow: 3px 3px 0px var(--shadow-color);
        }
        .sidebar a:active, .sidebar a.active {
            background: var(--btn-pink); transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--shadow-color);
        }
        .sidebar .close-btn {
            position: absolute; top: 15px; right: 15px; font-size: 32px; font-weight: 900;
            border: none; box-shadow: none; background: transparent; padding: 0; margin: 0; width: auto;
        }

        /* --- CONTAINER CHÍNH --- */
        .container { 
            width: 100%; max-width: 400px; margin: auto; padding: 10px 20px 80px 20px;
            position: relative; z-index: 10;
        }
        
        /* Tiêu đề SHOKAIMONO (Giống nút HY HY WORKSPACE) */
        h1 { 
            font-size: 24px; font-weight: 900; margin-bottom: 25px; text-align: center;
            text-transform: uppercase; color: var(--text-title);
            background: var(--btn-pink);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 4px 4px 0px var(--shadow-color);
        }

        /* Tabs */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* === CÁC NÚT BẤM (Viền đen, bóng cứng) === */
        a.btn { 
            display: flex; justify-content: space-between; align-items: center; 
            text-decoration: none; padding: 16px 20px; margin-bottom: 16px; 
            border-radius: 14px; 
            border: 3px solid var(--border-color); 
            box-shadow: 4px 4px 0px var(--shadow-color);
            color: var(--text-main);
            width: 100%; 
            transition: 0.1s;
            background: var(--btn-blue); /* Mặc định xanh nhạt */
        }
        /* Phối màu nút xen kẽ cho sinh động */
        a.btn:nth-child(odd) { background: var(--btn-pink); }
        a.btn:nth-child(even) { background: var(--btn-blue); }
        
        a.btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--shadow-color);
        }

        .btn-text { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .btn-icon-right { color: var(--border-color); font-size: 16px; font-weight: 900; }

        /* === GÓC REVIEW SẢN PHẨM === */
        .review-card { 
            background: #fff; 
            border-radius: 16px; margin-bottom: 18px; 
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--shadow-color);
            overflow: hidden; width: 100%; transition: 0.1s;
        }
        .review-card[open] { background: var(--btn-yellow); }

        .review-title { 
            padding: 16px 20px; font-size: 15px; font-weight: 800; color: var(--text-main); 
            cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
        }
        .review-title::-webkit-details-marker { display: none; }
        .review-title::after { content: "▼"; font-size: 12px; transition: 0.2s; }
        .review-card[open] .review-title::after { transform: rotate(180deg); }

        .review-body { padding: 0 20px 20px 20px; }
        .review-content { 
            font-size: 14px; font-weight: 600; white-space: pre-line; line-height: 1.6; 
            margin-bottom: 16px; padding-top: 12px; border-top: 2px dashed var(--border-color);
        }
        
        .btn-shopee { 
            display: block; background: var(--text-title); color: #fff !important; 
            text-align: center; padding: 14px; border-radius: 12px; text-decoration: none;
            font-weight: 800; font-size: 14px;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0px var(--border-color); transition: 0.1s;
        }
        .btn-shopee:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--border-color); }
        
        .loading { text-align: center; color: var(--text-main); font-weight: 800; font-size: 14px; margin-top: 20px; }

        /* === NÚT VỀ ĐẦU TRANG (SCROLL TO TOP) === */
        #scrollTopBtn {
            display: none; 
            position: fixed; bottom: 25px; right: 20px; z-index: 999;
            width: 50px; height: 50px;
            font-size: 20px; font-weight: 900;
            background: var(--btn-yellow);
            color: var(--border-color);
            border: 3px solid var(--border-color);
            border-radius: 50%;
            box-shadow: 3px 3px 0px var(--shadow-color);
            cursor: pointer;
            transition: 0.1s;
        }
        #scrollTopBtn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--shadow-color);
        }
    </style>
</head>
<body>
    
    <!-- Lớp bong bóng bay lơ lửng -->
    <div id="bg-container"></div>

    <!-- Nút Lên Đầu Trang -->
    <button id="scrollTopBtn" onclick="scrollToTop()">▲</button>

    <!-- SIDEBAR MENU -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">×</a>
        <a href="javascript:void(0)" onclick="openTab('tab-bio')" class="menu-item active">🌸 Mạng Xã Hội</a>
        <a href="javascript:void(0)" onclick="openTab('tab-files')" class="menu-item">💮 Link Tài Liệu</a>
        <a href="javascript:void(0)" onclick="openTab('tab-reviews')" class="menu-item">🌺 Góc Review</a>
    </div>

    <!-- HEADER: Menu 3 gạch & Đồng hồ -->
    <div class="header">
        <div class="menu-btn" onclick="openMenu()">☰</div>
        <div class="datetime-box">
            <div class="time-block" id="clock-time">--:--:--</div>
            <div class="date-block">
                <div id="clock-date-solar">Dương: ...</div>
                <div class="date-lunar" id="clock-date-lunar">(Âm: ...)</div>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>🌸 Shokaimono 🌸</h1>
        
        <!-- NỘI DUNG CÁC TAB -->
        <div id="tab-bio" class="tab-content active">
            <div id="bio-list"><p class="loading">Đang tải dữ liệu...</p></div>
        </div>

        <div id="tab-files" class="tab-content">
            <div id="file-list"><p class="loading">Đang tải dữ liệu...</p></div>
        </div>

        <div id="tab-reviews" class="tab-content">
            <div id="review-list"><p class="loading">Đang tải dữ liệu...</p></div>
        </div>
    </div>

    <script>
        /* TẠO BACKGROUND BONG BÓNG */
        function createBubbles() {
            const container = document.getElementById('bg-container');
            for (let i = 0; i < 15; i++) {
                let bubble = document.createElement('div');
                bubble.classList.add('bubble');
                let size = Math.random() * 20 + 10;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + 'vw';
                bubble.style.animationDuration = (Math.random() * 10 + 10) + 's';
                bubble.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(bubble);
            }
        }
        createBubbles();

        /* XỬ LÝ NÚT CUỘN LÊN ĐẦU TRANG */
        window.onscroll = function() {
            let btn = document.getElementById("scrollTopBtn");
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        };
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* XỬ LÝ MENU */
        function openMenu() { document.getElementById("mySidebar").style.width = "260px"; }
        function closeMenu() { document.getElementById("mySidebar").style.width = "0"; }
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            closeMenu();
        }

        /* ĐỒNG HỒ & CẮT CHUẨN NGÀY ÂM */
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('vi-VN', { hour12: false });
            
            const dateSolar = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            document.getElementById('clock-date-solar').innerText = `${dateSolar}`;
            
            // Lấy Lịch Âm và chỉ cắt đúng phần Ngày/Tháng, vứt bỏ năm (43...)
            try {
                const formatter = new Intl.DateTimeFormat('vi-VN', { day: 'numeric', month: 'numeric', calendar: 'chinese' });
                let rawLunar = formatter.format(now); // Thường ra "14/6" hoặc "14/6/43"
                let lunarParts = rawLunar.split(/[\/\-.]/); // Tách chuỗi bằng dấu / hoặc -
                let dateLunar = `${lunarParts[0]}/${lunarParts[1]}`; // Chỉ ghép ngày và tháng lại
                document.getElementById('clock-date-lunar').innerText = `(Âm: ${dateLunar})`;
            } catch (e) {
                document.getElementById('clock-date-lunar').innerText = `(Âm: N/A)`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* FETCH DỮ LIỆU TỪ GOOGLE SHEETS */
        const API_URL = "https://script.google.com/macros/s/AKfycbxAPpa4plhdHrMN-sycWG14RRdXUc8LpIiM4kWSY6IULevqzzk5Lc793uvd2Q3BohQCKg/exec";

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                const bioContainer = document.getElementById('bio-list');
                if (data.bio && data.bio.length > 0) {
                    bioContainer.innerHTML = data.bio.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">
                            <span class="btn-text">🌸 ${row[0]}</span>
                            <span class="btn-icon-right">▼</span>
                        </a>`
                    ).join('');
                } else { bioContainer.innerHTML = '<p class="loading">Đang tải dữ liệu...</p>'; }

                const fileContainer = document.getElementById('file-list');
                if (data.files && data.files.length > 0) {
                    fileContainer.innerHTML = data.files.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">
                            <span class="btn-text">💮 ${row[0]}</span>
                            <span class="btn-icon-right">▼</span>
                        </a>`
                    ).join('');
                } else { fileContainer.innerHTML = '<p class="loading">Đang tải dữ liệu...</p>'; }

                const reviewContainer = document.getElementById('review-list');
                if (data.reviews && data.reviews.length > 0) {
                    reviewContainer.innerHTML = data.reviews.map(row => 
                        `<details class="review-card">
                            <summary class="review-title">🌺 ${row[1]}</summary>
                            <div class="review-body">
                                <div class="review-content">${row[2]}</div>
                                <a href="${row[3]}" class="btn-shopee" target="_blank">Mua trên Shopee</a>
                            </div>
                        </details>`
                    ).join('');
                } else { reviewContainer.innerHTML = '<p class="loading">Đang tải dữ liệu...</p>'; }
            })
            .catch(error => {
                console.error("Lỗi:", error);
                document.querySelectorAll('.loading').forEach(el => el.innerText = "Lỗi khi tải dữ liệu.");
            });
    </script>
</body>
</html>
