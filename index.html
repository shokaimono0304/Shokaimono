<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shokaimono - Links & Reviews</title>
    <style>
        /* Tông màu Sakura Premium */
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            --sakura-primary: #ffb3c6;
            --sakura-text: #5c4148;
            --sakura-dark: #d77fa1;
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.8);
            --shadow-soft: 0 8px 32px rgba(215, 127, 161, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--sakura-text); 
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            line-height: 1.5;
            position: relative;
        }

        /* Container chứa hiệu ứng hoa rơi */
        #sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Cánh hoa anh đào */
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffcbe3 0%, #ffb7c5 100%);
            border-radius: 15px 0px 15px 0px;
            opacity: 0.8;
            box-shadow: 0 0 5px rgba(255,183,197,0.5);
            animation: fall linear infinite, sway ease-in-out infinite alternate;
        }

        @keyframes fall {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { top: 110%; opacity: 0; }
        }

        @keyframes sway {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(25px) rotate(45deg); }
        }

        /* Header chứa Menu và Đồng hồ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            font-size: 26px;
            cursor: pointer;
            color: var(--sakura-dark);
            transition: 0.3s;
        }
        .menu-btn:active { transform: scale(0.9); }

        .datetime-box { text-align: right; }
        .time-text { font-size: 16px; font-weight: 800; color: var(--sakura-dark); letter-spacing: 1px; }
        .date-text { font-size: 11px; color: #8e737c; margin-top: 2px; font-weight: 600; text-transform: uppercase;}

        /* Sidebar (Menu trượt) */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            background: rgba(255, 245, 248, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow-x: hidden;
            transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 5px 0 30px rgba(0,0,0,0.1);
            padding-top: 70px;
        }
        .sidebar a {
            padding: 16px 30px;
            text-decoration: none;
            font-size: 16px;
            color: var(--sakura-text);
            display: block;
            font-weight: 700;
            transition: 0.3s;
            border-left: 5px solid transparent;
            margin-bottom: 5px;
        }
        .sidebar a:hover, .sidebar a.active {
            color: var(--sakura-dark);
            background: linear-gradient(90deg, rgba(255, 179, 198, 0.2) 0%, transparent 100%);
            border-left: 5px solid var(--sakura-dark);
        }
        .sidebar .close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 36px;
            border-left: none;
            background: transparent;
            color: var(--sakura-dark);
        }

        /* Vùng nội dung chính */
        .container { 
            max-width: 500px; 
            margin: auto; 
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        
        h1 { 
            font-size: 28px; 
            font-weight: 900; 
            margin: 0 0 30px 0; 
            color: var(--sakura-dark); 
            letter-spacing: 2px; 
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(255, 179, 198, 0.5);
        }

        /* Tabs */
        .tab-content { display: none; animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Nút bấm (Links) */
        a.btn { 
            display: flex; justify-content: center; align-items: center; gap: 10px;
            text-decoration: none; padding: 18px; margin-bottom: 16px; 
            border-radius: 50px; font-weight: 700; font-size: 15px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--sakura-text);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-soft);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        a.btn:active {
            transform: scale(0.96);
            background: rgba(255,255,255,0.9);
            border-color: var(--sakura-dark);
            color: var(--sakura-dark);
        }

        /* === GÓC REVIEW (Accordion) === */
        .review-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px; 
            margin-bottom: 18px; 
            box-shadow: var(--shadow-soft); 
            text-align: left; 
            border: 1px solid var(--card-border);
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .review-card[open] {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--sakura-primary);
        }

        /* Tiêu đề Review */
        .review-title { 
            padding: 20px;
            font-size: 15px; 
            font-weight: 700; 
            color: var(--sakura-text); 
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        
        .review-title::-webkit-details-marker { display: none; }
        
        /* Mũi tên hoa anh đào */
        .review-title::after {
            content: "🌸";
            font-size: 14px;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: drop-shadow(0 2px 4px rgba(215, 127, 161, 0.3));
        }
        .review-card[open] .review-title::after {
            transform: rotate(180deg);
        }

        /* Nội dung chi tiết Review */
        .review-body {
            padding: 0 20px 20px 20px;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .review-content { 
            font-size: 14px; 
            color: var(--sakura-text); 
            white-space: pre-line; 
            line-height: 1.8; 
            margin-bottom: 20px;
            padding-top: 15px;
            border-top: 1px dashed var(--sakura-primary);
        }
        
        .btn-shopee { 
            display: block;
            background: linear-gradient(135deg, #ff9eb5 0%, #ff7597 100%); 
            color: #fff !important; 
            text-align: center; 
            padding: 15px; 
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(255, 117, 151, 0.4);
            border: none;
            transition: 0.2s;
        }
        .btn-shopee:active { transform: scale(0.96); }
        
        .loading { color: #d77fa1; font-style: italic; font-weight: 500; font-size: 14px; }
    </style>
</head>
<body>
    
    <!-- Lớp phủ hiệu ứng hoa anh đào rơi -->
    <div id="sakura-container"></div>

    <!-- SIDEBAR MENU -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">×</a>
        <a href="javascript:void(0)" onclick="openTab('tab-bio')" class="menu-item active">🌸 Mạng Xã Hội</a>
        <a href="javascript:void(0)" onclick="openTab('tab-files')" class="menu-item">💮 Link Tài Liệu</a>
        <a href="javascript:void(0)" onclick="openTab('tab-reviews')" class="menu-item">🌺 Góc Review</a>
    </div>

    <!-- HEADER: Menu 3 gạch & Đồng hồ -->
    <div class="header">
        <div class="menu-btn" onclick="openMenu()">☰</div>
        <div class="datetime-box">
            <div class="time-text" id="clock-time">--:--:--</div>
            <div class="date-text" id="clock-date">Đang tải...</div>
        </div>
    </div>

    <div class="container">
        
        <!-- Tên Hiển Thị Chính -->
        <h1>Shokaimono</h1>
        
        <!-- NỘI DUNG CÁC TAB -->
        <!-- TAB 1: BIO -->
        <div id="tab-bio" class="tab-content active">
            <div id="bio-list"><p class="loading">Đang nở hoa tải dữ liệu...</p></div>
        </div>

        <!-- TAB 2: TÀI LIỆU -->
        <div id="tab-files" class="tab-content">
            <div id="file-list"><p class="loading">Đang nở hoa tải dữ liệu...</p></div>
        </div>

        <!-- TAB 3: REVIEW -->
        <div id="tab-reviews" class="tab-content">
            <div id="review-list"><p class="loading">Đang nở hoa tải dữ liệu...</p></div>
        </div>
    </div>

    <script>
        /* === TẠO HIỆU ỨNG HOA ANH ĐÀO RƠI === */
        function createSakura() {
            const container = document.getElementById('sakura-container');
            const numPetals = 35; // Số lượng cánh hoa
            
            for (let i = 0; i < numPetals; i++) {
                let petal = document.createElement('div');
                petal.classList.add('petal');
                
                // Random vị trí, kích thước và tốc độ cho từng cánh hoa
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = (Math.random() * 8 + 6) + 'px'; 
                petal.style.height = (Math.random() * 10 + 8) + 'px'; 
                
                // Tốc độ rơi và độ lắc lư
                let fallDuration = Math.random() * 6 + 5; 
                let swayDuration = Math.random() * 3 + 2; 
                petal.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
                
                // Độ trễ ngẫu nhiên để hoa không rụng cùng 1 lúc
                petal.style.animationDelay = `${Math.random() * 10}s`;
                
                container.appendChild(petal);
            }
        }
        createSakura();

        /* === XỬ LÝ MENU & TABS === */
        function openMenu() { document.getElementById("mySidebar").style.width = "270px"; }
        function closeMenu() { document.getElementById("mySidebar").style.width = "0"; }

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            closeMenu();
        }

        /* === XỬ LÝ ĐỒNG HỒ & NGÀY ÂM LỊCH === */
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('vi-VN', { hour12: false });
            const dateSolar = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            
            let dateLunar = "";
            try {
                const formatter = new Intl.DateTimeFormat('vi-VN', { day: 'numeric', month: 'numeric', year: 'numeric', calendar: 'chinese' });
                dateLunar = formatter.format(now);
            } catch (e) {
                dateLunar = "N/A";
            }

            document.getElementById('clock-time').innerText = timeStr;
            document.getElementById('clock-date').innerText = `Dương: ${dateSolar} • Âm: ${dateLunar}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* === FETCH DỮ LIỆU TỪ GOOGLE SHEETS === */
        const API_URL = "https://script.google.com/macros/s/AKfycbxAPpa4plhdHrMN-sycWG14RRdXUc8LpIiM4kWSY6IULevqzzk5Lc793uvd2Q3BohQCKg/exec";

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                // Đổ dữ liệu Tab BIO
                const bioContainer = document.getElementById('bio-list');
                if (data.bio && data.bio.length > 0) {
                    bioContainer.innerHTML = data.bio.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">🌸 ${row[0]}</a>`
                    ).join('');
                } else { bioContainer.innerHTML = '<p class="loading">Chưa có liên kết nào</p>'; }

                // Đổ dữ liệu Tab TÀI LIỆU
                const fileContainer = document.getElementById('file-list');
                if (data.files && data.files.length > 0) {
                    fileContainer.innerHTML = data.files.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">💮 ${row[0]}</a>`
                    ).join('');
                } else { fileContainer.innerHTML = '<p class="loading">Chưa có tài liệu nào</p>'; }

                // Đổ dữ liệu Tab REVIEW (Dạng Accordion thu gọn)
                const reviewContainer = document.getElementById('review-list');
                if (data.reviews && data.reviews.length > 0) {
                    reviewContainer.innerHTML = data.reviews.map(row => 
                        `<details class="review-card">
                            <summary class="review-title">🌺 ${row[1]}</summary>
                            <div class="review-body">
                                <div class="review-content">${row[2]}</div>
                                <a href="${row[3]}" class="btn-shopee" target="_blank">🏵️ Mua trên Shopee</a>
                            </div>
                        </details>`
                    ).join('');
                } else { reviewContainer.innerHTML = '<p class="loading">Chưa có review nào</p>'; }
            })
            .catch(error => {
                console.error("Lỗi tải dữ liệu:", error);
                document.querySelectorAll('.loading').forEach(el => el.innerText = "Không thể tải dữ liệu.");
            });
    </script>
</body>
</html>
