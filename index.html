<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shokaimono - Links & Reviews</title>
    <style>
        /* Tông màu Sakura Pastel Sang Trọng */
        :root {
            --bg-gradient: linear-gradient(145deg, #fff5f7 0%, #ffe6eb 100%);
            --sakura-primary: #f8a5c2;
            --sakura-text: #785a63;
            --sakura-dark: #d77fa1;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 1);
            --shadow-soft: 0 10px 25px rgba(232, 169, 185, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--sakura-text); 
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Header chứa Menu và Đồng hồ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            font-size: 24px;
            cursor: pointer;
            color: var(--sakura-dark);
            padding: 5px;
        }

        .datetime-box { text-align: right; }
        .time-text { font-size: 16px; font-weight: 800; color: var(--sakura-dark); letter-spacing: 0.5px; }
        .date-text { font-size: 11px; color: #9f878f; margin-top: 2px; font-weight: 500; }

        /* Sidebar (Menu trượt) */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            background: rgba(255, 248, 250, 0.98);
            backdrop-filter: blur(15px);
            overflow-x: hidden;
            transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 5px 0 20px rgba(0,0,0,0.05);
            padding-top: 60px;
        }
        .sidebar a {
            padding: 16px 30px;
            text-decoration: none;
            font-size: 16px;
            color: var(--sakura-text);
            display: block;
            font-weight: 700;
            transition: 0.3s;
            border-left: 4px solid transparent;
            margin-bottom: 5px;
        }
        .sidebar a:hover, .sidebar a.active {
            color: var(--sakura-dark);
            background: linear-gradient(90deg, rgba(248, 165, 194, 0.15) 0%, transparent 100%);
            border-left: 4px solid var(--sakura-primary);
        }
        .sidebar .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 32px;
            border-left: none;
            background: transparent;
            padding: 5px 15px;
            color: var(--sakura-dark);
        }

        /* Vùng nội dung chính */
        .container { 
            max-width: 500px; 
            margin: auto; 
            padding: 30px 20px 40px;
            text-align: center;
        }
        
        .avatar { 
            width: 120px; height: 120px; 
            border-radius: 50%; 
            border: 5px solid rgba(255,255,255,0.8); 
            box-shadow: 0 8px 25px rgba(248, 165, 194, 0.4); 
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 { font-size: 24px; font-weight: 800; margin: 0 0 5px 0; color: var(--sakura-dark); letter-spacing: 0.5px; }
        .bio-description { font-size: 14px; color: #9f878f; margin-bottom: 30px; font-weight: 500; }

        /* Tabs */
        .tab-content { display: none; animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            font-size: 14px; color: #9f878f; margin: 0 0 20px 0; 
            text-transform: uppercase; letter-spacing: 2px; 
            font-weight: 700;
        }

        /* Nút bấm (Links) - Pill shape bo tròn hoàn toàn */
        a.btn { 
            display: flex; justify-content: center; align-items: center; gap: 8px;
            text-decoration: none; padding: 16px; margin-bottom: 15px; 
            border-radius: 50px; font-weight: 700; font-size: 15px;
            background: var(--card-bg);
            color: var(--sakura-dark);
            border: 2px solid var(--card-border);
            box-shadow: var(--shadow-soft);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        a.btn:active, a.btn:hover {
            transform: scale(0.98);
            border-color: var(--sakura-primary);
            background: #fff;
        }

        /* === TÍNH NĂNG ACCORDION CHO GÓC REVIEW === */
        .review-card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            margin-bottom: 16px; 
            box-shadow: var(--shadow-soft); 
            text-align: left; 
            border: 2px solid var(--card-border);
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .review-card[open] {
            border-color: rgba(248, 165, 194, 0.5);
            background: #fff;
        }

        /* Tiêu đề (Tên sản phẩm) */
        .review-title { 
            padding: 18px 20px;
            font-size: 15px; 
            font-weight: 700; 
            color: var(--sakura-text); 
            cursor: pointer;
            list-style: none; /* Ẩn mũi tên mặc định */
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        
        .review-title::-webkit-details-marker { display: none; } /* Ẩn mũi tên Safari */
        
        /* Mũi tên chỉ xuống tùy chỉnh */
        .review-title::after {
            content: "🌸";
            font-size: 12px;
            transition: transform 0.4s ease;
            filter: grayscale(0.5);
        }
        .review-card[open] .review-title::after {
            transform: rotate(180deg);
            filter: grayscale(0);
        }

        /* Phần nội dung chi tiết ẩn bên trong */
        .review-body {
            padding: 0 20px 20px 20px;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .review-content { 
            font-size: 14px; 
            color: var(--sakura-text); 
            white-space: pre-line; 
            line-height: 1.7; 
            margin-bottom: 20px;
            padding-top: 15px;
            border-top: 1px dashed rgba(248, 165, 194, 0.4);
        }
        
        .btn-shopee { 
            display: block;
            background: linear-gradient(135deg, #ff9eb5 0%, #f8a5c2 100%); 
            color: #fff !important; 
            text-align: center; 
            padding: 14px; 
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(248, 165, 194, 0.4);
            border: none;
        }
        .btn-shopee:active { transform: scale(0.97); }
        
        .loading { color: #bcaaa4; font-style: italic; font-weight: 500; }
    </style>
</head>
<body>

    <!-- SIDEBAR MENU -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">×</a>
        <a href="javascript:void(0)" onclick="openTab('tab-bio')" class="menu-item active">🌸 Mạng Xã Hội</a>
        <a href="javascript:void(0)" onclick="openTab('tab-files')" class="menu-item">💮 Link Tài Liệu</a>
        <a href="javascript:void(0)" onclick="openTab('tab-reviews')" class="menu-item">🌺 Góc Review</a>
    </div>

    <!-- HEADER: Menu 3 gạch & Đồng hồ -->
    <div class="header">
        <div class="menu-btn" onclick="openMenu()">☰</div>
        <div class="datetime-box">
            <div class="time-text" id="clock-time">--:--:--</div>
            <div class="date-text" id="clock-date">Đang tải...</div>
        </div>
    </div>

    <div class="container">
        <!-- AVATAR (Luôn hiển thị) -->
        <img src="https://via.placeholder.com/150/ffb7c5/ffffff?text=Avatar" alt="Shokaimono" class="avatar">
        <h1>Shokaimono</h1>
        <div class="bio-description">Góc nhỏ ngập tràn hoa anh đào 🌸</div>
        
        <!-- NỘI DUNG CÁC TAB -->
        <!-- TAB 1: BIO -->
        <div id="tab-bio" class="tab-content active">
            <h2>🌸 Nơi mình hoạt động</h2>
            <div id="bio-list"><p class="loading">Đang tải dữ liệu...</p></div>
        </div>

        <!-- TAB 2: TÀI LIỆU -->
        <div id="tab-files" class="tab-content">
            <h2>💮 Tài liệu chia sẻ</h2>
            <div id="file-list"><p class="loading">Đang tải dữ liệu...</p></div>
        </div>

        <!-- TAB 3: REVIEW -->
        <div id="tab-reviews" class="tab-content">
            <h2>🌺 Review sản phẩm</h2>
            <div id="review-list"><p class="loading">Đang tải dữ liệu...</p></div>
        </div>
    </div>

    <script>
        /* === 1. XỬ LÝ MENU & TABS === */
        function openMenu() { document.getElementById("mySidebar").style.width = "260px"; }
        function closeMenu() { document.getElementById("mySidebar").style.width = "0"; }

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            closeMenu();
        }

        /* === 2. XỬ LÝ ĐỒNG HỒ & NGÀY ÂM LỊCH === */
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('vi-VN', { hour12: false });
            const dateSolar = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            
            let dateLunar = "";
            try {
                const formatter = new Intl.DateTimeFormat('vi-VN', { day: 'numeric', month: 'numeric', year: 'numeric', calendar: 'chinese' });
                dateLunar = formatter.format(now);
            } catch (e) {
                dateLunar = "N/A";
            }

            document.getElementById('clock-time').innerText = timeStr;
            document.getElementById('clock-date').innerText = `Dương: ${dateSolar} • Âm: ${dateLunar}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* === 3. FETCH DỮ LIỆU TỪ GOOGLE SHEETS === */
        const API_URL = "https://script.google.com/macros/s/AKfycbxAPpa4plhdHrMN-sycWG14RRdXUc8LpIiM4kWSY6IULevqzzk5Lc793uvd2Q3BohQCKg/exec";

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                // Đổ dữ liệu Tab BIO
                const bioContainer = document.getElementById('bio-list');
                if (data.bio && data.bio.length > 0) {
                    bioContainer.innerHTML = data.bio.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">🌸 ${row[0]}</a>`
                    ).join('');
                } else { bioContainer.innerHTML = '<p class="loading">Chưa có liên kết nào</p>'; }

                // Đổ dữ liệu Tab TÀI LIỆU
                const fileContainer = document.getElementById('file-list');
                if (data.files && data.files.length > 0) {
                    fileContainer.innerHTML = data.files.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">💮 ${row[0]}</a>`
                    ).join('');
                } else { fileContainer.innerHTML = '<p class="loading">Chưa có tài liệu nào</p>'; }

                // Đổ dữ liệu Tab REVIEW (Dạng Accordion thu gọn)
                const reviewContainer = document.getElementById('review-list');
                if (data.reviews && data.reviews.length > 0) {
                    reviewContainer.innerHTML = data.reviews.map(row => 
                        `<details class="review-card">
                            <summary class="review-title">🌺 ${row[1]}</summary>
                            <div class="review-body">
                                <div class="review-content">${row[2]}</div>
                                <a href="${row[3]}" class="btn-shopee" target="_blank">🏵️ Mua trên Shopee</a>
                            </div>
                        </details>`
                    ).join('');
                } else { reviewContainer.innerHTML = '<p class="loading">Chưa có review nào</p>'; }
            })
            .catch(error => {
                console.error("Lỗi tải dữ liệu:", error);
                document.querySelectorAll('.loading').forEach(el => el.innerText = "Không thể tải dữ liệu.");
            });
    </script>
</body>
</html>
