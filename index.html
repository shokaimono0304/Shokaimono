<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shokaimono - Links & Reviews</title>
    <style>
        /* Tông màu Sakura Hiện Đại & Rành Mạch */
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #fbe9ed 100%);
            --sakura-primary: #ffb7c5; /* Màu viền chính */
            --sakura-text: #5c3a43;    /* Màu chữ chính */
            --sakura-dark: #b84b6b;    /* Màu nhấn (tiêu đề, icon) */
            --card-bg: rgba(255, 255, 255, 0.9);
            --shadow-soft: 0 4px 15px rgba(184, 75, 107, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--sakura-text); 
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hiệu ứng hoa rơi */
        #sakura-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0;
        }
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffd3e0 0%, #ffb7c5 100%);
            border-radius: 15px 0px 15px 0px;
            opacity: 0.5;
            animation: fall linear infinite, sway ease-in-out infinite alternate;
        }
        @keyframes fall {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { top: 110%; opacity: 0; }
        }
        @keyframes sway {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(20px) rotate(45deg); }
        }

        /* Header (Menu & Clock) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid #ffe1e8;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            font-size: 26px;
            cursor: pointer;
            color: var(--sakura-dark);
            padding-top: 4px;
        }

        /* Đồng hồ */
        .datetime-box { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
        .time-text { font-size: 17px; font-weight: 700; color: var(--sakura-dark); }
        .date-text { font-size: 11px; color: #8e737c; font-weight: 600; text-transform: uppercase; }

        /* Sidebar (Menu trượt) */
        .sidebar {
            height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; left: 0;
            background: rgba(255, 250, 251, 0.98);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            overflow-x: hidden; transition: 0.3s;
            box-shadow: 5px 0 20px rgba(0,0,0,0.05); padding-top: 60px;
        }
        .sidebar a {
            padding: 16px 25px; text-decoration: none; font-size: 15px;
            color: var(--sakura-text); display: block; font-weight: 600;
            border-left: 4px solid transparent; transition: 0.2s;
        }
        .sidebar a.active {
            color: var(--sakura-dark); background: #fff2f5; border-left: 4px solid var(--sakura-dark);
        }
        .sidebar .close-btn {
            position: absolute; top: 10px; right: 20px; font-size: 32px; color: var(--sakura-dark);
        }

        /* Container Chính - Thu hẹp lại để nút ôm sát chữ và bằng nhau */
        .container { 
            width: 100%;
            max-width: 360px; /* Thu nhỏ để fit vừa vặn */
            margin: auto; 
            padding: 30px 20px 50px 20px;
            position: relative;
            z-index: 10;
        }
        
        h1 { 
            font-size: 26px; 
            font-weight: 800; 
            margin-bottom: 30px; 
            text-align: center;
            letter-spacing: 2px; 
            text-transform: uppercase;
            color: var(--sakura-dark);
        }

        /* Tabs */
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === CÁC NÚT BẤM (FB, TIKTOK, TÀI LIỆU) === */
        a.btn { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            text-decoration: none; 
            padding: 14px 18px; /* Giảm độ phồng của nút */
            margin-bottom: 12px; 
            border-radius: 12px; /* Bo góc vuông vức hơn một chút */
            background: var(--card-bg);
            border: 1.5px solid var(--sakura-primary); /* Viền màu rõ nét */
            box-shadow: var(--shadow-soft);
            color: var(--sakura-text);
            width: 100%; /* Đảm bảo tất cả các nút dài bằng nhau */
        }
        a.btn:active {
            background: #fff0f3;
            border-color: var(--sakura-dark);
        }

        .btn-text {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon-right {
            color: var(--sakura-primary);
            font-size: 12px;
            font-weight: bold;
        }

        /* === GÓC REVIEW SẢN PHẨM === */
        .review-card { 
            background: var(--card-bg); 
            border-radius: 14px; 
            margin-bottom: 16px; 
            box-shadow: var(--shadow-soft); 
            border: 1.5px solid var(--sakura-primary);
            overflow: hidden;
            width: 100%;
        }
        .review-card[open] {
            background: #ffffff;
            border-color: var(--sakura-dark);
        }

        .review-title { 
            padding: 16px 18px;
            font-size: 14px; 
            font-weight: 600; 
            color: var(--sakura-text); 
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .review-title::-webkit-details-marker { display: none; }
        .review-title::after {
            content: "🌸";
            font-size: 13px;
            transition: transform 0.3s;
        }
        .review-card[open] .review-title::after { transform: rotate(180deg); }

        .review-body {
            padding: 0 18px 18px 18px;
        }

        .review-content { 
            font-size: 13.5px; 
            color: #4a333a; 
            white-space: pre-line; 
            line-height: 1.6; 
            margin-bottom: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--sakura-primary);
        }
        
        .btn-shopee { 
            display: block;
            background: var(--sakura-dark); 
            color: #fff !important; 
            text-align: center; 
            padding: 12px; 
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13.5px;
            border: none;
        }
        .btn-shopee:active { opacity: 0.8; }
        
        .loading { 
            text-align: center;
            color: var(--sakura-dark); 
            font-style: italic; 
            font-size: 13px; 
            margin-top: 20px;
        }
    </style>
</head>
<body>
    
    <div id="sakura-container"></div>

    <!-- SIDEBAR MENU -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">×</a>
        <a href="javascript:void(0)" onclick="openTab('tab-bio')" class="menu-item active">🌸 Mạng Xã Hội</a>
        <a href="javascript:void(0)" onclick="openTab('tab-files')" class="menu-item">💮 Link Tài Liệu</a>
        <a href="javascript:void(0)" onclick="openTab('tab-reviews')" class="menu-item">🌺 Góc Review</a>
    </div>

    <!-- HEADER: Menu 3 gạch & Đồng hồ 3 dòng -->
    <div class="header">
        <div class="menu-btn" onclick="openMenu()">☰</div>
        <div class="datetime-box">
            <div class="time-text" id="clock-time">--:--:--</div>
            <div class="date-text" id="clock-date-solar">Dương: Đang tải...</div>
            <div class="date-text" id="clock-date-lunar">Âm: Đang tải...</div>
        </div>
    </div>

    <div class="container">
        <h1>Shokaimono</h1>
        
        <!-- NỘI DUNG CÁC TAB -->
        <div id="tab-bio" class="tab-content active">
            <div id="bio-list"><p class="loading">Đang tải dữ liệu...</p></div>
        </div>

        <div id="tab-files" class="tab-content">
            <div id="file-list"><p class="loading">Đang tải dữ liệu...</p></div>
        </div>

        <div id="tab-reviews" class="tab-content">
            <div id="review-list"><p class="loading">Đang tải dữ liệu...</p></div>
        </div>
    </div>

    <script>
        /* TẠO HOA RƠI */
        function createSakura() {
            const container = document.getElementById('sakura-container');
            for (let i = 0; i < 20; i++) {
                let petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = (Math.random() * 6 + 5) + 'px'; 
                petal.style.height = (Math.random() * 8 + 6) + 'px'; 
                petal.style.animationDuration = `${Math.random() * 7 + 6}s, ${Math.random() * 3 + 2}s`;
                petal.style.animationDelay = `${Math.random() * 10}s`;
                container.appendChild(petal);
            }
        }
        createSakura();

        /* XỬ LÝ MENU */
        function openMenu() { document.getElementById("mySidebar").style.width = "250px"; }
        function closeMenu() { document.getElementById("mySidebar").style.width = "0"; }
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            closeMenu();
        }

        /* ĐỒNG HỒ & ĐỊNH DẠNG NGÀY ÂM/DƯƠNG */
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('vi-VN', { hour12: false });
            
            // Ngày Dương
            const dateSolar = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            document.getElementById('clock-date-solar').innerText = `Dương: ${dateSolar}`;
            
            // Ngày Âm (Thay thế dấu - thành dấu /)
            try {
                const formatter = new Intl.DateTimeFormat('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', calendar: 'chinese' });
                let rawLunar = formatter.format(now);
                // Đổi dấu gạch ngang hoặc dấu chấm thành dấu gạch chéo
                let dateLunar = rawLunar.replace(/[-.]/g, '/'); 
                document.getElementById('clock-date-lunar').innerText = `Âm: ${dateLunar}`;
            } catch (e) {
                document.getElementById('clock-date-lunar').innerText = `Âm: N/A`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* FETCH DỮ LIỆU TỪ GOOGLE SHEETS */
        const API_URL = "https://script.google.com/macros/s/AKfycbxAPpa4plhdHrMN-sycWG14RRdXUc8LpIiM4kWSY6IULevqzzk5Lc793uvd2Q3BohQCKg/exec";

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                const bioContainer = document.getElementById('bio-list');
                if (data.bio && data.bio.length > 0) {
                    bioContainer.innerHTML = data.bio.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">
                            <span class="btn-text">🌸 ${row[0]}</span>
                            <span class="btn-icon-right">❯</span>
                        </a>`
                    ).join('');
                } else { bioContainer.innerHTML = '<p class="loading">Chưa có liên kết nào</p>'; }

                const fileContainer = document.getElementById('file-list');
                if (data.files && data.files.length > 0) {
                    fileContainer.innerHTML = data.files.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">
                            <span class="btn-text">💮 ${row[0]}</span>
                            <span class="btn-icon-right">❯</span>
                        </a>`
                    ).join('');
                } else { fileContainer.innerHTML = '<p class="loading">Chưa có tài liệu nào</p>'; }

                const reviewContainer = document.getElementById('review-list');
                if (data.reviews && data.reviews.length > 0) {
                    reviewContainer.innerHTML = data.reviews.map(row => 
                        `<details class="review-card">
                            <summary class="review-title">🌺 ${row[1]}</summary>
                            <div class="review-body">
                                <div class="review-content">${row[2]}</div>
                                <a href="${row[3]}" class="btn-shopee" target="_blank">Mua trên Shopee</a>
                            </div>
                        </details>`
                    ).join('');
                } else { reviewContainer.innerHTML = '<p class="loading">Chưa có review nào</p>'; }
            })
            .catch(error => {
                console.error("Lỗi tải dữ liệu:", error);
                document.querySelectorAll('.loading').forEach(el => el.innerText = "Lỗi khi tải dữ liệu.");
            });
    </script>
</body>
</html>
