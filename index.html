<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shokaimono - Links & Reviews</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* Tông màu Neo-Brutalism Pastel */
        :root {
            --bg-main: #f0f8f9;       
            --border-color: #2d3436;  
            --shadow-color: #2d3436;  
            
            --btn-pink: #ffe5ec;      
            --btn-blue: #e5f0ff;      
            --btn-yellow: #fff3cd;    
            
            --text-main: #2d3436;
            --text-title: #d63031;    
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Nunito', sans-serif;
            background: var(--bg-main);
            color: var(--text-main); 
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        button, input, select, textarea { font-family: inherit; }

        /* --- BACKGROUND --- */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffd3e0 0%, #ffb7c5 100%);
            border-radius: 15px 0px 15px 0px;
            opacity: 0.7;
            box-shadow: 1px 1px 3px rgba(255, 183, 197, 0.5);
            animation: fall linear infinite, sway ease-in-out infinite alternate;
        }
        @keyframes fall {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { top: 110%; opacity: 0; }
        }
        @keyframes sway {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(25px) rotate(45deg); }
        }
        @keyframes sway-rain {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(60px) rotate(45deg); }
        }
        @keyframes fall-reverse {
            0% { top: 110%; opacity: 0; }
            10% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { top: -10%; opacity: 0; }
        }
        .glow-petal {
            box-shadow: 0 0 12px 3px rgba(255, 105, 180, 0.8) !important;
            background: linear-gradient(135deg, #ff9eb5 0%, #ff4b82 100%) !important;
        }

        /* --- HEADER & MENU --- */
        .header {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 15px 20px; background: transparent; position: relative; z-index: 100;
        }

        .menu-btn {
            font-size: 28px; cursor: pointer; color: var(--border-color); background: #fff;
            border: 3px solid var(--border-color); border-radius: 12px;
            width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
            box-shadow: 3px 3px 0px var(--shadow-color); transition: 0.1s;
        }
        .menu-btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px var(--shadow-color); }

        .datetime-box { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .time-block, .date-block {
            background: #fff; border: 3px solid var(--border-color);
            border-radius: 12px; padding: 4px 12px;
            box-shadow: 3px 3px 0px var(--shadow-color); text-align: center;
        }
        .time-block { color: var(--text-title); font-weight: 900; font-size: 16px; background: var(--btn-pink); }
        .date-block { font-size: 12px; font-weight: 800; color: #0984e3; background: var(--btn-blue); line-height: 1.4; }
        .date-lunar { font-size: 11px; color: var(--border-color); }

        /* === BOX TỪ VỰNG TIẾNG NHẬT TÙY CHỈNH MỚI === */
        .vocab-block {
            background: #fff; border: 3px solid var(--border-color);
            border-radius: 12px; padding: 8px 5px; display: flex; align-items: center;
            box-shadow: 3px 3px 0px var(--shadow-color); margin-top: 2px;
            width: 185px; justify-content: space-between; user-select: none;
        }
        .vocab-btn {
            cursor: pointer; padding: 5px; font-size: 12px; color: var(--border-color); 
            font-weight: 900; transition: 0.1s; background: var(--btn-yellow); border-radius: 8px;
            border: 2px solid var(--border-color);
        }
        .vocab-btn:active { transform: scale(0.9); }
        .vocab-btn.disabled { opacity: 0.3; cursor: not-allowed; }
        
        .vocab-content { text-align: center; flex: 1; padding: 0 4px; display: flex; flex-direction: column; gap: 2px; }
        .vocab-label { font-size: 10px; font-weight: 900; color: var(--text-title); text-transform: uppercase; border-bottom: 2px dashed var(--btn-pink); padding-bottom: 4px; margin-bottom: 2px; }
        
        /* Chữ Kanji chính */
        .vocab-word { font-size: 20px; font-weight: 900; color: var(--border-color); line-height: 1.1; }
        
        /* Phiên âm */
        .vocab-furi { font-size: 11px; font-weight: 800; color: #d63031; }
        
        /* Nghĩa Tiếng Việt */
        .vocab-mean { font-size: 13px; font-weight: 800; color: #0984e3; margin-bottom: 2px; }
        
        /* Cụm từ */
        .vocab-phrase { font-size: 11px; font-weight: 800; color: var(--border-color); background: var(--btn-yellow); border-radius: 6px; padding: 3px 6px; display: inline-block; border: 1px solid var(--border-color); margin: 0 auto; }
        
        /* Nghĩa cụm từ */
        .vocab-pmean { font-size: 11px; font-weight: 700; color: var(--border-color); line-height: 1.3;}

        /* --- SIDEBAR MENU --- */
        .sidebar {
            height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; left: 0;
            background: var(--bg-main); border-right: 4px solid var(--border-color);
            overflow-x: hidden; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); padding-top: 80px;
        }
        .sidebar a {
            padding: 16px 25px; text-decoration: none; font-size: 16px; color: var(--text-main); 
            display: block; font-weight: 800; margin: 0 15px 15px 15px; border: 3px solid var(--border-color);
            border-radius: 12px; background: #fff; box-shadow: 3px 3px 0px var(--shadow-color); transition: 0.1s;
        }
        .sidebar a:active, .sidebar a.active {
            background: var(--btn-pink); transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--shadow-color);
        }
        .sidebar .close-btn {
            position: absolute; top: 15px; right: 15px; font-size: 32px; font-weight: 900;
            border: none; box-shadow: none; background: transparent; padding: 0; margin: 0; width: auto;
        }

        /* --- CONTAINER CHÍNH --- */
        .container { 
            width: 100%; max-width: 400px; margin: auto; padding: 10px 20px 80px 20px;
            position: relative; z-index: 10;
        }

        .title-wrapper { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        h1 { 
            font-size: 24px; font-weight: 900; text-align: center; text-transform: uppercase; color: var(--text-title);
            background: var(--btn-pink); border: 3px solid var(--border-color); border-radius: 16px;
            padding: 15px 20px; box-shadow: 4px 4px 0px var(--shadow-color); margin: 0; width: 100%;
        }
        .tab-indicator {
            display: inline-block; background: var(--btn-yellow); border: 3px solid var(--border-color);
            border-radius: 20px; padding: 4px 16px; font-size: 13px; font-weight: 900; color: var(--border-color);
            box-shadow: 2px 2px 0px var(--shadow-color); text-transform: uppercase;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }

        /* SKELETON LOADING */
        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite; border-radius: 14px; height: 58px; margin-bottom: 16px;
            border: 3px solid #cbd5e1; box-shadow: 4px 4px 0px #cbd5e1; width: 100%;
        }
        .skeleton-large { height: 75px; border-radius: 16px; }
        @keyframes skeletonLoading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        a.btn { 
            display: flex; justify-content: space-between; align-items: center; 
            text-decoration: none; padding: 16px 20px; margin-bottom: 16px; border-radius: 14px; 
            border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--shadow-color);
            color: var(--text-main); width: 100%; transition: 0.1s; background: var(--btn-blue);
        }
        a.btn:nth-child(odd) { background: var(--btn-pink); }
        a.btn:nth-child(even) { background: var(--btn-blue); }
        a.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px var(--shadow-color); }
        .btn-text { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .btn-icon-right { color: var(--border-color); font-size: 16px; font-weight: 900; }

        /* === THANH LỌC VUỐT NGANG === */
        .filter-scroll-container {
            display: flex; align-items: center; gap: 10px; overflow-x: auto;
            padding-bottom: 15px; margin-bottom: 10px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .filter-scroll-container::-webkit-scrollbar { display: none; }
        .filter-chip {
            white-space: nowrap; padding: 10px 18px; border: 3px solid var(--border-color);
            border-radius: 14px; background: #fff; font-weight: 800; font-size: 14px;
            cursor: pointer; box-shadow: 3px 3px 0px var(--shadow-color); transition: 0.1s;
            flex-shrink: 0;
        }
        .filter-chip:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--shadow-color); }
        .filter-chip.active { background: var(--btn-yellow); color: var(--text-title); }

        /* GÓC REVIEW */
        .review-card { 
            background: var(--btn-blue); border-radius: 16px; margin-bottom: 18px; 
            border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--shadow-color);
            overflow: hidden; width: 100%; transition: 0.2s ease-in-out;
        }
        .review-card:nth-child(odd) { background: var(--btn-pink); }
        .review-card:nth-child(even) { background: var(--btn-blue); }
        .review-card[open] { background: var(--btn-yellow); }

        .review-title { 
            padding: 16px 20px; font-size: 15px; font-weight: 800; color: var(--text-main); 
            cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
            gap: 10px;
        }
        .review-title::-webkit-details-marker { display: none; }
        
        .title-text { flex: 1; line-height: 1.4; display: flex; align-items: center; gap: 6px;}
        .title-meta { display: flex; align-items: center; gap: 8px; }
        .dropdown-arrow { font-size: 12px; transition: transform 0.2s; }
        .review-card[open] .dropdown-arrow { transform: rotate(180deg); }

        .cat-badge {
            background: #fff; border: 2px solid var(--border-color);
            padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 800;
            color: #0984e3; box-shadow: 2px 2px 0px var(--shadow-color); white-space: nowrap;
        }

        .review-body { padding: 0 20px 20px 20px; }
        
        .review-img {
            width: 100%; height: auto; max-height: 250px; object-fit: cover; cursor: zoom-in;
            border-radius: 12px; border: 3px solid var(--border-color); margin-bottom: 15px; background: #fff;
        }

        .review-content { 
            font-size: 14px; font-weight: 600; white-space: pre-line; line-height: 1.6; 
            margin-bottom: 16px; padding-top: 12px; border-top: 2px dashed var(--border-color);
        }
        
        .shop-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .btn-shop { 
            flex: 1; min-width: 90px; display: block; color: #fff !important; text-align: center; 
            padding: 12px 8px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 13px;
            border: 3px solid var(--border-color); box-shadow: 2px 2px 0px var(--border-color); transition: 0.1s;
        }
        .btn-shop:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--border-color); }
        .btn-shopee { background: #ee4d2d; } .btn-lazada { background: #0a31aa; } .btn-tiktok { background: #000000; }

        /* NÚT CUỘN LÊN & NÚT NHẠC */
        .float-btn {
            position: fixed; z-index: 999; width: 50px; height: 50px; font-size: 20px; font-weight: 900; 
            background: var(--btn-yellow); color: var(--border-color); border: 3px solid var(--border-color); 
            border-radius: 50%; box-shadow: 3px 3px 0px var(--shadow-color); cursor: pointer; transition: 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .float-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px var(--shadow-color); }
        
        #scrollTopBtn { bottom: 25px; right: 20px; display: none; }
        #musicToggleBtn { bottom: 25px; left: 20px; background: #fff;}

        /* === LIGHTBOX & ZOOM ẢNH === */
        .lightbox-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 10000; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .lightbox-img-wrapper {
            position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
        }
        .lightbox-img {
            max-width: 95%; max-height: 90vh; object-fit: contain; border-radius: 8px;
            transition: transform 0.1s ease-out; touch-action: none;
        }
        .close-lightbox {
            position: absolute; top: 20px; right: 20px; color: #fff; font-size: 35px; font-weight: 900;
            background: var(--border-color); width: 45px; height: 45px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10001;
            border: 3px solid #fff; box-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body>
    
    <div id="bg-container"></div>
    <button id="scrollTopBtn" class="float-btn" onclick="scrollToTop()">🌸</button>
    
    <!-- Nút điều khiển nhạc -->
    <button id="musicToggleBtn" class="float-btn" onclick="toggleMusic()">🔇</button>
    
    <!-- AUDIO HTML (Dành cho link .mp3) -->
    <audio id="html-audio" loop style="display:none;"></audio>
    <!-- Vùng chứa YouTube -->
    <div id="ytplayer" style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;"></div>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">×</a>
        <a href="javascript:void(0)" onclick="openTab('tab-bio', this)" class="menu-item active">🌸 Mạng Xã Hội</a>
        <a href="javascript:void(0)" onclick="openTab('tab-files', this)" class="menu-item">💮 Link Tài Liệu</a>
        <a href="javascript:void(0)" onclick="openTab('tab-reviews', this)" class="menu-item">🍡 Góc Review</a>
    </div>

    <div class="header">
        <div class="menu-btn" onclick="openMenu()">☰</div>
        <div class="datetime-box">
            <div class="time-block" id="clock-time">--:--:--</div>
            <div class="date-block">
                <div id="clock-date-solar">Thứ... <br>Dương: ...</div>
                <div class="date-lunar" id="clock-date-lunar">(Âm: ...)</div>
            </div>
            
            <!-- GÓC TỪ VỰNG TIẾNG NHẬT -->
            <div class="vocab-block">
                <div class="vocab-btn" onclick="changeVocab(-1)">◀</div>
                <div class="vocab-content">
                    <div class="vocab-label" id="vocab-label">Hôm nay</div>
                    <div class="vocab-word" id="vocab-word">桜</div>
                    <div class="vocab-furi" id="vocab-furi">さくら (Sakura)</div>
                    <div class="vocab-mean" id="vocab-mean">Hoa anh đào</div>
                    <div class="vocab-phrase" id="vocab-phrase">桜が咲く</div>
                    <div class="vocab-pmean" id="vocab-pmean">Hoa anh đào nở</div>
                </div>
                <div class="vocab-btn" id="vocab-next-btn" onclick="changeVocab(1)">▶</div>
            </div>
            
        </div>
    </div>

    <div class="container">
        <div class="title-wrapper">
            <h1>🌸 Shokaimono 🌸</h1>
            <div id="current-tab-title" class="tab-indicator">🌸 Mạng Xã Hội</div>
        </div>
        
        <div id="tab-bio" class="tab-content active">
            <div id="bio-list">
                <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
            </div>
        </div>

        <div id="tab-files" class="tab-content">
            <div id="file-list">
                <div class="skeleton"></div><div class="skeleton"></div>
            </div>
        </div>

        <div id="tab-reviews" class="tab-content">
            <div class="filter-scroll-container" id="filter-container" style="display:none;"></div>
            <div id="review-list">
                <div class="skeleton skeleton-large"></div>
                <div class="skeleton skeleton-large"></div>
            </div>
        </div>
    </div>

    <!-- LIGHTBOX OVERLAY (Phóng to ảnh) -->
    <div id="lightboxOverlay" class="lightbox-overlay" onclick="closeLightbox(event)">
        <div class="close-lightbox" onclick="closeLightbox(event, true)">×</div>
        <div class="lightbox-img-wrapper">
            <img id="lightboxImg" class="lightbox-img" src="" alt="Zoomed">
        </div>
    </div>

    <!-- Tải thư viện API của YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        /* =========================================
           TỪ VỰNG TIẾNG NHẬT MỖI NGÀY
        ========================================= */
        const vocabList = [
            { w: "桜", f: "さくら (Sakura)", m: "Hoa anh đào", p: "桜が咲く", pm: "Hoa anh đào nở" },
            { w: "猫", f: "ねこ (Neko)", m: "Con mèo", p: "可愛い猫", pm: "Con mèo dễ thương" },
            { w: "海", f: "うみ (Umi)", m: "Bãi biển", p: "海で泳ぐ", pm: "Bơi ở biển" },
            { w: "空", f: "そら (Sora)", m: "Bầu trời", p: "空が青い", pm: "Bầu trời xanh" },
            { w: "星", f: "ほし (Hoshi)", m: "Ngôi sao", p: "星が輝く", pm: "Sao lấp lánh" },
            { w: "月", f: "つき (Tsuki)", m: "Mặt trăng", p: "満月", pm: "Trăng rằm" },
            { w: "太陽", f: "たいよう (Taiyou)", m: "Mặt trời", p: "太陽の光", pm: "Ánh sáng mặt trời" },
            { w: "水", f: "みず (Mizu)", m: "Nước", p: "水を飲む", pm: "Uống nước" },
            { w: "風", f: "かぜ (Kaze)", m: "Làn gió", p: "強い風", pm: "Gió mạnh" },
            { w: "雪", f: "ゆき (Yuki)", m: "Tuyết", p: "雪が降る", pm: "Tuyết rơi" },
            { w: "春", f: "はる (Haru)", m: "Mùa xuân", p: "春が来る", pm: "Mùa xuân đến" },
            { w: "夏", f: "なつ (Natsu)", m: "Mùa hè", p: "暑い夏", pm: "Mùa hè nóng bức" },
            { w: "秋", f: "あき (Aki)", m: "Mùa thu", p: "秋の風", pm: "Gió mùa thu" },
            { w: "冬", f: "ふゆ (Fuyu)", m: "Mùa đông", p: "寒い冬", pm: "Mùa đông lạnh" },
            { w: "愛", f: "あい (Ai)", m: "Tình yêu", p: "愛してる", pm: "Anh yêu em" },
            { w: "夢", f: "ゆめ (Yume)", m: "Giấc mơ", p: "夢を見る", pm: "Mơ một giấc mơ" },
            { w: "笑顔", f: "えがお (Egao)", m: "Nụ cười", p: "素敵な笑顔", pm: "Nụ cười tuyệt vời" },
            { w: "希望", f: "きぼう (Kibou)", m: "Sự hy vọng", p: "希望を持つ", pm: "Mang niềm hy vọng" },
            { w: "家族", f: "かぞく (Kazoku)", m: "Gia đình", p: "大切な家族", pm: "Gia đình trân quý" },
            { w: "友達", f: "ともだち (Tomodachi)", m: "Bạn bè", p: "親友", pm: "Bạn thân" },
            { w: "時間", f: "じかん (Jikan)", m: "Thời gian", p: "時間を守る", pm: "Giữ đúng giờ" },
            { w: "未来", f: "みらい (Mirai)", m: "Tương lai", p: "明るい未来", pm: "Tương lai tươi sáng" },
            { w: "平和", f: "へいわ (Heiwa)", m: "Hòa bình", p: "平和な世界", pm: "Thế giới hòa bình" },
            { w: "森", f: "もり (Mori)", m: "Khu rừng", p: "森の中", pm: "Trong khu rừng" },
            { w: "花", f: "はな (Hana)", m: "Bông hoa", p: "花を飾る", pm: "Trang trí hoa" }
        ];

        let vocabOffset = 0; // 0 = Hôm nay, -1 = Hôm qua. Không cho số dương.

        function renderVocab() {
            const today = new Date();
            today.setDate(today.getDate() + vocabOffset);
            
            // Tính số thứ tự ngày cố định để mỗi ngày luôn ra đúng 1 từ đó
            const baseTime = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
            const dayIndex = Math.floor(baseTime / (1000 * 60 * 60 * 24));
            
            // Lấy từ vựng (dùng % để lặp lại danh sách)
            const wordObj = vocabList[dayIndex % vocabList.length];

            // Cập nhật nhãn thời gian
            let labelStr = "Hôm nay";
            if (vocabOffset === -1) labelStr = "Hôm qua";
            else if (vocabOffset === -2) labelStr = "Hôm kia";
            else if (vocabOffset < -2) labelStr = Math.abs(vocabOffset) + " ngày trước";

            document.getElementById('vocab-label').innerText = labelStr;
            document.getElementById('vocab-word').innerText = wordObj.w;
            document.getElementById('vocab-furi').innerText = wordObj.f;
            document.getElementById('vocab-mean').innerText = wordObj.m;
            document.getElementById('vocab-phrase').innerText = wordObj.p;
            document.getElementById('vocab-pmean').innerText = wordObj.pm;

            // Xử lý nút Next (Tương lai)
            const nextBtn = document.getElementById('vocab-next-btn');
            if (vocabOffset === 0) {
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.classList.remove('disabled');
            }
        }

        function changeVocab(delta) {
            if (vocabOffset + delta > 0) return; // Chặn không cho tiến tới ngày mai
            vocabOffset += delta;
            renderVocab();
        }
        
        // Chạy lần đầu để load từ vựng hôm nay
        renderVocab();


        /* =========================================
           CÀI ĐẶT NHẠC (HYBRID YOUTUBE & MP3)
        ========================================= */
        const MUSIC_SOURCE = "https://music.youtube.com/watch?v=CoSc0Qqd5L0&si=Hb4BXCbEJcp4Vu3I"; 
        
        let playerType = 'none'; 
        let ytPlayer;
        let isPlaying = false;
        let userInteracted = false;
        const htmlAudio = document.getElementById('html-audio');
        const musicBtn = document.getElementById('musicToggleBtn');

        function getYTVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function initMusicSystem() {
            if (MUSIC_SOURCE.includes('.mp3') || MUSIC_SOURCE.includes('.wav') || (!MUSIC_SOURCE.includes('youtu') && MUSIC_SOURCE.includes('http'))) {
                playerType = 'audio';
                htmlAudio.src = MUSIC_SOURCE;
                htmlAudio.onplay = () => { isPlaying = true; musicBtn.innerText = "🎵"; };
                htmlAudio.onpause = () => { isPlaying = false; musicBtn.innerText = "🔇"; };
            } 
            else { playerType = 'youtube'; }
        }
        initMusicSystem();

        function onYouTubeIframeAPIReady() {
            if (playerType !== 'youtube') return;
            
            let videoId = getYTVideoId(MUSIC_SOURCE) || (MUSIC_SOURCE.length === 11 ? MUSIC_SOURCE : 'jfKfPfyJRdk');
            ytPlayer = new YT.Player('ytplayer', {
                height: '0', width: '0', videoId: videoId,
                playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': videoId, 'controls': 0 },
                events: {
                    'onReady': (event) => { event.target.playVideo(); },
                    'onStateChange': (event) => {
                        if (event.data == YT.PlayerState.PLAYING) { musicBtn.innerText = "🎵"; isPlaying = true; } 
                        else if (event.data == YT.PlayerState.PAUSED) { musicBtn.innerText = "🔇"; isPlaying = false; }
                    }
                }
            });
        }

        function toggleMusic() {
            if (playerType === 'audio') {
                if (htmlAudio.paused) { htmlAudio.play(); } else { htmlAudio.pause(); }
            } else if (playerType === 'youtube' && ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
                if (ytPlayer.getPlayerState() == YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); } 
                else { ytPlayer.playVideo(); }
            }
            userInteracted = true; 
        }

        document.body.addEventListener('click', function(e) {
            if (!userInteracted && e.target.id !== 'musicToggleBtn' && !e.target.classList.contains('vocab-btn')) {
                if (playerType === 'audio' && htmlAudio.paused) {
                    htmlAudio.play().catch(e => console.log("Trình duyệt chặn autoplay"));
                } else if (playerType === 'youtube' && ytPlayer && typeof ytPlayer.playVideo === 'function' && ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
                    ytPlayer.playVideo();
                }
                userInteracted = true;
            }
        });


        /* =========================================
           HỆ THỐNG PHÓNG TO ẢNH (PINCH TO ZOOM)
        ========================================= */
        const lightbox = document.getElementById('lightboxOverlay');
        const lightboxImg = document.getElementById('lightboxImg');
        let currentScale = 1;
        let initialDistance = null;

        function openLightbox(imgSrc) {
            lightbox.style.display = 'flex';
            lightboxImg.src = imgSrc;
            currentScale = 1;
            lightboxImg.style.transform = `scale(1)`;
        }

        function closeLightbox(e, force = false) {
            if (force || e.target === lightbox || e.target.classList.contains('lightbox-img-wrapper')) {
                lightbox.style.display = 'none';
                lightboxImg.src = '';
            }
        }

        lightboxImg.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        });

        lightboxImg.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance) {
                e.preventDefault();
                const currentDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                
                let scaleChange = currentDistance / initialDistance;
                let newScale = currentScale * scaleChange;
                
                if (newScale < 1) newScale = 1;
                if (newScale > 4) newScale = 4;
                
                lightboxImg.style.transform = `scale(${newScale})`;
                initialDistance = currentDistance;
                currentScale = newScale;
            }
        });

        lightboxImg.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) { initialDistance = null; }
        });


        /* =========================================
           HIỆU ỨNG HOA RƠI & GIAO DIỆN CHUNG
        ========================================= */
        function createSakura() {
            const container = document.getElementById('bg-container');
            const day = new Date().getDay(); 
            let numPetals = 25; let speedMod = 1; let swayMod = 1; let effectType = 'normal'; 
            const themeEmojis = ['🌸', '💮', '🌺', '🏵️', '🌷', '🍡', '🎐', '🍵', '🎀'];
            
            if (day === 0) { numPetals = 15; speedMod = 1.5; } else if (day === 1) { numPetals = 35; speedMod = 0.6; } 
            else if (day === 2) { numPetals = 25; swayMod = 0.4; } else if (day === 3) { numPetals = 40; speedMod = 0.8; effectType = 'rain'; } 
            else if (day === 4) { numPetals = 25; effectType = 'reverse'; } else if (day === 5) { numPetals = 20; effectType = 'glow'; } 
            else if (day === 6) { numPetals = 25; effectType = 'emoji'; }

            for (let i = 0; i < numPetals; i++) {
                let petal = document.createElement('div'); petal.classList.add('petal');
                let size = Math.random() * 8 + 6;
                if (day === 0) size += 4; if (effectType === 'rain') size -= 2; 

                if (effectType === 'emoji') {
                    petal.innerText = themeEmojis[Math.floor(Math.random() * themeEmojis.length)];
                    petal.style.background = 'transparent'; petal.style.boxShadow = 'none'; petal.style.fontSize = (size + 12) + 'px'; 
                    petal.style.display = 'flex'; petal.style.alignItems = 'center'; petal.style.justifyContent = 'center';
                } else {
                    petal.style.width = size + 'px'; petal.style.height = (size + 3) + 'px';
                }

                if (effectType === 'glow') petal.classList.add('glow-petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationName = `${effectType === 'reverse' ? 'fall-reverse' : 'fall'}, ${effectType === 'rain' ? 'sway-rain' : 'sway'}`;
                petal.style.animationDuration = (Math.random() * 5 * speedMod + 5 * speedMod) + 's, ' + (Math.random() * 3 * swayMod + 2 * swayMod) + 's';
                petal.style.animationDelay = (Math.random() * 10) + 's, ' + (Math.random() * 10) + 's';
                container.appendChild(petal);
            }
        }
        createSakura();

        window.onscroll = function() {
            let btn = document.getElementById("scrollTopBtn");
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) { btn.style.display = "flex"; } else { btn.style.display = "none"; }
        };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function openMenu() { document.getElementById("mySidebar").style.width = "260px"; }
        function closeMenu() { document.getElementById("mySidebar").style.width = "0"; }
        function openTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('current-tab-title').innerText = btnElement.innerText;
            closeMenu();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('vi-VN', { hour12: false });
            const days = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
            document.getElementById('clock-date-solar').innerHTML = `<span style="color: var(--text-title); font-size: 13px;">${days[now.getDay()]}</span><br>Dương: ${now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' })}`;
            try {
                let rawLunar = new Intl.DateTimeFormat('vi-VN', { day: 'numeric', month: 'numeric', calendar: 'chinese' }).format(now); 
                let lunarParts = rawLunar.split(/[\/\-.]/);
                document.getElementById('clock-date-lunar').innerText = `(Âm: ${lunarParts[0]}/${lunarParts[1]})`;
            } catch (e) { document.getElementById('clock-date-lunar').innerText = `(Âm: N/A)`; }
        }
        setInterval(updateClock, 1000); updateClock();

        const listIcons = ['🌸', '💮', '🌺', '🏵️', '🌷', '🍡', '🎐', '🍵', '🎀'];
        function getRandomIcon() { return listIcons[Math.floor(Math.random() * listIcons.length)]; }


        /* =========================================
           FETCH DỮ LIỆU TỪ GOOGLE SHEET
        ========================================= */
        const API_URL = "https://script.google.com/macros/s/AKfycbxAPpa4plhdHrMN-sycWG14RRdXUc8LpIiM4kWSY6IULevqzzk5Lc793uvd2Q3BohQCKg/exec";
        let allReviewsData = [];

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const bioContainer = document.getElementById('bio-list');
                if (data.bio && data.bio.length > 0) {
                    bioContainer.innerHTML = data.bio.map(row => `<a href="${row[1] || '#'}" class="btn" target="_blank"><span class="btn-text">${getRandomIcon()} ${row[0] || 'Link'}</span><span class="btn-icon-right">▼</span></a>`).join('');
                } else { bioContainer.innerHTML = '<p style="text-align:center; font-weight: bold;">Chưa có liên kết nào</p>'; }

                const fileContainer = document.getElementById('file-list');
                if (data.files && data.files.length > 0) {
                    fileContainer.innerHTML = data.files.map(row => `<a href="${row[1] || '#'}" class="btn" target="_blank"><span class="btn-text">${getRandomIcon()} ${row[0] || 'Tài liệu'}</span><span class="btn-icon-right">▼</span></a>`).join('');
                } else { fileContainer.innerHTML = '<p style="text-align:center; font-weight: bold;">Chưa có tài liệu nào</p>'; }

                if (data.reviews && data.reviews.length > 0) {
                    allReviewsData = data.reviews;
                    renderCategoryDropdown();
                    renderReviews("Tất cả"); 
                } else { 
                    document.getElementById('review-list').innerHTML = '<p style="text-align:center; font-weight: bold;">Chưa có bài review nào</p>'; 
                    document.getElementById('filter-container').style.display = 'none';
                }
            } catch (error) {
                console.error("Lỗi:", error);
                const errorMsg = '<p style="text-align:center; color:red; font-weight: bold;">Lỗi tải dữ liệu. Vui lòng F5 lại trang!</p>';
                document.getElementById('bio-list').innerHTML = errorMsg; 
                document.getElementById('file-list').innerHTML = errorMsg; 
                document.getElementById('review-list').innerHTML = errorMsg;
            }
        }

        function renderCategoryDropdown() {
            const filterContainer = document.getElementById('filter-container');
            const categories = new Set();
            allReviewsData.forEach(row => {
                if (row[6] && String(row[6]).trim() !== '') categories.add(String(row[6]).trim());
            });

            if (categories.size === 0) { filterContainer.style.display = 'none'; return; } 
            else { filterContainer.style.display = 'flex'; }
            
            let html = `<div class="filter-chip active" onclick="filterByCategory('Tất cả', this)">🌸 Tất cả</div>`;
            categories.forEach(cat => { html += `<div class="filter-chip" onclick="filterByCategory('${cat}', this)">${cat}</div>`; });
            filterContainer.innerHTML = html;
        }

        function filterByCategory(categoryName, itemElement) {
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            itemElement.classList.add('active');
            itemElement.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
            renderReviews(categoryName);
        }

        function getDirectImageUrl(url) {
            if (!url) return '';
            url = String(url).trim();
            let driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (url.includes('drive.google.com') && driveMatch) {
                return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
            }
            return url; 
        }

        function renderReviews(categoryName) {
            const reviewContainer = document.getElementById('review-list');
            const filteredData = allReviewsData.filter(row => {
                if (categoryName === "Tất cả") return true;
                return (row[6] ? String(row[6]).trim() : "") === categoryName;
            });

            if (filteredData.length === 0) {
                reviewContainer.innerHTML = '<p style="text-align:center; font-weight:800; padding:20px;">🥲 Chưa có bài review nào cho mục này...</p>';
                return;
            }

            reviewContainer.innerHTML = filteredData.map(row => {
                let shopeeBtn = row[3] ? `<a href="${row[3]}" class="btn-shop btn-shopee" target="_blank">🛒 Shopee</a>` : '';
                let lazadaBtn = row[4] ? `<a href="${row[4]}" class="btn-shop btn-lazada" target="_blank">💙 Lazada</a>` : '';
                let tiktokBtn = row[5] ? `<a href="${row[5]}" class="btn-shop btn-tiktok" target="_blank">🎵 TikTok</a>` : '';
                
                let imageHtml = '';
                let imgUrl = getDirectImageUrl(row[7]); 
                if (imgUrl !== '') {
                    imageHtml = `<img src="${imgUrl}" alt="Ảnh sản phẩm" class="review-img" loading="lazy" onclick="openLightbox('${imgUrl}')">`;
                }

                let catBadgeHtml = row[6] ? `<span class="cat-badge">${String(row[6]).trim()}</span>` : '';
                
                return `<details class="review-card">
                    <summary class="review-title">
                        <span class="title-text">${getRandomIcon()} ${row[1] || 'Sản phẩm'}</span>
                        <span class="title-meta">
                            ${catBadgeHtml}
                            <span class="dropdown-arrow">▼</span>
                        </span>
                    </summary>
                    <div class="review-body">
                        ${imageHtml}
                        <div class="review-content">${row[2] || ''}</div>
                        <div class="shop-buttons">
                            ${shopeeBtn}
                            ${lazadaBtn}
                            ${tiktokBtn}
                        </div>
                    </div>
                </details>`;
            }).join('');
        }

        document.addEventListener("DOMContentLoaded", loadData);
    </script>
