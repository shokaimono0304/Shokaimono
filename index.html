<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shokaimono - Links & Reviews</title>
    <style>
        /* Tông màu Sakura Premium & Minimalist */
        :root {
            --bg-gradient: linear-gradient(120deg, #fdfbfb 0%, #ffebf0 100%);
            --sakura-primary: #ff9eb5;
            --sakura-text: #4a333a;
            --sakura-dark: #c56586;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.9);
            --shadow-soft: 0 10px 30px rgba(197, 101, 134, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--sakura-text); 
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Container chứa hiệu ứng hoa rơi */
        #sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffd3e0 0%, #ffb7c5 100%);
            border-radius: 15px 0px 15px 0px;
            opacity: 0.6;
            box-shadow: 0 0 8px rgba(255,183,197,0.4);
            animation: fall linear infinite, sway ease-in-out infinite alternate;
        }

        @keyframes fall {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { top: 110%; opacity: 0; }
        }
        @keyframes sway {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(20px) rotate(45deg); }
        }

        /* Header (Menu & Clock) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            font-size: 28px;
            cursor: pointer;
            color: var(--sakura-dark);
            transition: 0.2s;
            padding-top: 5px;
        }
        .menu-btn:active { transform: scale(0.9); }

        /* Đồng hồ 3 dòng tách biệt */
        .datetime-box { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            gap: 2px;
        }
        .time-text { font-size: 18px; font-weight: 800; color: var(--sakura-dark); letter-spacing: 0.5px; }
        .date-text { font-size: 11px; color: #8e737c; font-weight: 600; text-transform: uppercase; }

        /* Sidebar (Menu trượt) */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            background: rgba(255, 248, 250, 0.98);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            overflow-x: hidden;
            transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
            padding-top: 80px;
        }
        .sidebar a {
            padding: 18px 30px;
            text-decoration: none;
            font-size: 16px;
            color: var(--sakura-text);
            display: block;
            font-weight: 700;
            transition: 0.3s;
            border-left: 4px solid transparent;
        }
        .sidebar a:hover, .sidebar a.active {
            color: var(--sakura-dark);
            background: linear-gradient(90deg, rgba(255, 158, 181, 0.1) 0%, transparent 100%);
            border-left: 4px solid var(--sakura-dark);
        }
        .sidebar .close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 36px;
            font-weight: 300;
            color: var(--sakura-dark);
            padding: 0;
        }

        /* Container Chính - Đã fit tỷ lệ mobile */
        .container { 
            width: 100%;
            max-width: 480px; /* Chuẩn tỷ lệ điện thoại */
            margin: auto; 
            padding: 35px 20px 60px 20px;
            position: relative;
            z-index: 10;
        }
        
        /* Tiêu đề SHOKAIMONO tráng gương */
        h1 { 
            font-size: 30px; 
            font-weight: 900; 
            margin-bottom: 35px; 
            text-align: center;
            letter-spacing: 3px; 
            text-transform: uppercase;
            background: linear-gradient(to right, #c56586, #ff8da6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(255, 158, 181, 0.3));
        }

        /* Hiệu ứng chuyển Tab */
        .tab-content { display: none; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .tab-content.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === GIAO DIỆN CÁC NÚT (FB, TIKTOK, IG, FILE) === */
        a.btn { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            text-decoration: none; 
            padding: 20px 22px; 
            margin-bottom: 16px; 
            border-radius: 18px; /* Bo góc cong nhẹ hiện đại */
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--card-border);
            box-shadow: var(--shadow-soft);
            transition: all 0.25s ease;
        }
        
        a.btn:active {
            transform: scale(0.97);
            background: rgba(255,255,255,0.95);
            border-color: var(--sakura-primary);
        }

        .btn-text {
            font-size: 15.5px;
            font-weight: 700;
            color: var(--sakura-text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon-right {
            color: #d1a3b4;
            font-size: 14px;
            font-weight: bold;
        }

        /* === GÓC REVIEW SẢN PHẨM === */
        .review-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px; 
            margin-bottom: 20px; 
            box-shadow: var(--shadow-soft); 
            border: 1.5px solid var(--card-border);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .review-card[open] {
            background: #ffffff;
            border-color: rgba(255, 158, 181, 0.6);
            box-shadow: 0 15px 35px rgba(197, 101, 134, 0.12);
        }

        .review-title { 
            padding: 20px 22px;
            font-size: 15.5px; 
            font-weight: 700; 
            color: var(--sakura-text); 
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        
        .review-title::-webkit-details-marker { display: none; }
        
        .review-title::after {
            content: "🌸";
            font-size: 15px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 2px 4px rgba(197, 101, 134, 0.2));
        }
        .review-card[open] .review-title::after { transform: rotate(180deg); }

        .review-body {
            padding: 0 22px 22px 22px;
            animation: fadeInBody 0.4s ease-out;
        }

        @keyframes fadeInBody {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .review-content { 
            font-size: 14.5px; 
            color: #5c4148; 
            white-space: pre-line; 
            line-height: 1.7; 
            margin-bottom: 20px;
            padding-top: 15px;
            border-top: 1px dashed var(--sakura-primary);
        }
        
        .btn-shopee { 
            display: block;
            background: linear-gradient(135deg, #ff8da6 0%, #c56586 100%); 
            color: #fff !important; 
            text-align: center; 
            padding: 16px; 
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 6px 20px rgba(197, 101, 134, 0.3);
            border: none;
            transition: 0.2s;
            letter-spacing: 0.5px;
        }
        .btn-shopee:active { transform: scale(0.97); }
        
        .loading { 
            text-align: center;
            color: #c56586; 
            font-style: italic; 
            font-weight: 500; 
            font-size: 14px; 
            margin-top: 20px;
        }
    </style>
</head>
<body>
    
    <!-- Lớp phủ hiệu ứng hoa anh đào rơi -->
    <div id="sakura-container"></div>

    <!-- SIDEBAR MENU -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">×</a>
        <a href="javascript:void(0)" onclick="openTab('tab-bio')" class="menu-item active">🌸 Mạng Xã Hội</a>
        <a href="javascript:void(0)" onclick="openTab('tab-files')" class="menu-item">💮 Link Tài Liệu</a>
        <a href="javascript:void(0)" onclick="openTab('tab-reviews')" class="menu-item">🌺 Góc Review</a>
    </div>

    <!-- HEADER: Menu 3 gạch & Đồng hồ 3 dòng -->
    <div class="header">
        <div class="menu-btn" onclick="openMenu()">☰</div>
        <div class="datetime-box">
            <div class="time-text" id="clock-time">--:--:--</div>
            <div class="date-text" id="clock-date-solar">Dương: Đang tải...</div>
            <div class="date-text" id="clock-date-lunar">Âm: Đang tải...</div>
        </div>
    </div>

    <div class="container">
        
        <!-- Tên Hiển Thị Chính -->
        <h1>Shokaimono</h1>
        
        <!-- NỘI DUNG CÁC TAB -->
        <!-- TAB 1: BIO -->
        <div id="tab-bio" class="tab-content active">
            <div id="bio-list"><p class="loading">Đang chờ hoa nở...</p></div>
        </div>

        <!-- TAB 2: TÀI LIỆU -->
        <div id="tab-files" class="tab-content">
            <div id="file-list"><p class="loading">Đang chờ hoa nở...</p></div>
        </div>

        <!-- TAB 3: REVIEW -->
        <div id="tab-reviews" class="tab-content">
            <div id="review-list"><p class="loading">Đang chờ hoa nở...</p></div>
        </div>
    </div>

    <script>
        /* === TẠO HIỆU ỨNG HOA ANH ĐÀO RƠI MỊN MÀNG === */
        function createSakura() {
            const container = document.getElementById('sakura-container');
            const numPetals = 25; // Giảm số lượng để không bị rối mắt
            
            for (let i = 0; i < numPetals; i++) {
                let petal = document.createElement('div');
                petal.classList.add('petal');
                
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = (Math.random() * 6 + 5) + 'px'; 
                petal.style.height = (Math.random() * 8 + 6) + 'px'; 
                
                let fallDuration = Math.random() * 7 + 6; 
                let swayDuration = Math.random() * 3 + 2; 
                petal.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
                petal.style.animationDelay = `${Math.random() * 10}s`;
                
                container.appendChild(petal);
            }
        }
        createSakura();

        /* === XỬ LÝ MENU & TABS === */
        function openMenu() { document.getElementById("mySidebar").style.width = "280px"; }
        function closeMenu() { document.getElementById("mySidebar").style.width = "0"; }

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            closeMenu();
        }

        /* === XỬ LÝ ĐỒNG HỒ 3 DÒNG === */
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('vi-VN', { hour12: false });
            const dateSolar = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            
            let dateLunar = "";
            try {
                const formatter = new Intl.DateTimeFormat('vi-VN', { day: 'numeric', month: 'numeric', year: 'numeric', calendar: 'chinese' });
                dateLunar = formatter.format(now);
            } catch (e) {
                dateLunar = "N/A";
            }

            document.getElementById('clock-time').innerText = timeStr;
            document.getElementById('clock-date-solar').innerText = `Dương: ${dateSolar}`;
            document.getElementById('clock-date-lunar').innerText = `Âm: ${dateLunar}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* === FETCH DỮ LIỆU TỪ GOOGLE SHEETS === */
        const API_URL = "https://script.google.com/macros/s/AKfycbxAPpa4plhdHrMN-sycWG14RRdXUc8LpIiM4kWSY6IULevqzzk5Lc793uvd2Q3BohQCKg/exec";

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                // Đổ dữ liệu Tab BIO (Card style mới)
                const bioContainer = document.getElementById('bio-list');
                if (data.bio && data.bio.length > 0) {
                    bioContainer.innerHTML = data.bio.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">
                            <span class="btn-text">🌸 ${row[0]}</span>
                            <span class="btn-icon-right">❯</span>
                        </a>`
                    ).join('');
                } else { bioContainer.innerHTML = '<p class="loading">Chưa có liên kết nào</p>'; }

                // Đổ dữ liệu Tab TÀI LIỆU (Card style mới)
                const fileContainer = document.getElementById('file-list');
                if (data.files && data.files.length > 0) {
                    fileContainer.innerHTML = data.files.map(row => 
                        `<a href="${row[1]}" class="btn" target="_blank">
                            <span class="btn-text">💮 ${row[0]}</span>
                            <span class="btn-icon-right">❯</span>
                        </a>`
                    ).join('');
                } else { fileContainer.innerHTML = '<p class="loading">Chưa có tài liệu nào</p>'; }

                // Đổ dữ liệu Tab REVIEW (Card style mới)
                const reviewContainer = document.getElementById('review-list');
                if (data.reviews && data.reviews.length > 0) {
                    reviewContainer.innerHTML = data.reviews.map(row => 
                        `<details class="review-card">
                            <summary class="review-title">🌺 ${row[1]}</summary>
                            <div class="review-body">
                                <div class="review-content">${row[2]}</div>
                                <a href="${row[3]}" class="btn-shopee" target="_blank">Mua trên Shopee ➔</a>
                            </div>
                        </details>`
                    ).join('');
                } else { reviewContainer.innerHTML = '<p class="loading">Chưa có review nào</p>'; }
            })
            .catch(error => {
                console.error("Lỗi tải dữ liệu:", error);
                document.querySelectorAll('.loading').forEach(el => el.innerText = "Không thể tải dữ liệu.");
            });
    </script>
</body>
</html>
